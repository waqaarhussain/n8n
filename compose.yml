name: waqaar-n8n
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
  n8n:
    image: ${N8N_IMAGE:?Run install.sh first}
    restart: unless-stopped
    ports:
      - '${N8N_BIND:-127.0.0.1}:5678:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Missing encryption key}
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}/
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      EXECUTIONS_DATA_MAX_AGE: '168'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      school-bridge:
        condition: service_healthy
    networks: [backend]
  school-bridge:
    build: ./bridge
    restart: unless-stopped
    environment:
      CONFIG_PATH: /config/settings.json
      STATE_PATH: /data/state.sqlite3
    volumes:
      - ./config:/config:ro
      - ./data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
networks:
  backend:
volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
